# Public app (static assets) plus the family sharing API under /api/*.
name = "andata-ritorno-app"
main = "src/index.js"
compatibility_date = "2026-10-01"
# One origin only: IndexedDB is per-origin, so a second hostname would show an empty app.
workers_dev = false
preview_urls = false
routes = [
  { pattern = "app.ar.gxware.org", custom_domain = true },
]

[assets]
directory = "../app/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Only /api/* runs the Worker first; everything else is served straight from the assets.
run_worker_first = ["/api/*"]

[vars]
APP_ORIGIN = "https://app.ar.gxware.org"
# The landing site, allowed to open Checkout (POST /api/checkout) and read the code it produced.
SITE_ORIGIN = "https://ar.gxware.org"
# Stripe payment links behind GET /api/buy/family and /api/buy/slot (closed registrations stop family sales).
PAY_LINK_FAMILY = "https://buy.stripe.com/cNi5kC0T4aKjgzW8BA5EY02"
PAY_LINK_SLOT = "https://buy.stripe.com/6oUeVcdFQ3hRbfC4lk5EY01"
# Stripe price ids (not secret); set the real ones at deploy time.
# PRICE_FAMILY sells one year (6,99 €); PRICE_FAMILY_LIFETIME is the 4,99 € one-off price sold until
# 2026-11-25, still honoured for sessions paid before the switch (their codes never expire).
PRICE_FAMILY = "price_1Ufo3kCfwq1bSlj7zweKpm6M"
PRICE_FAMILY_LIFETIME = "price_1UX1rBCfwq1bSlj7kUtZDqVK"
PRICE_SLOT = "price_1UX1rBCfwq1bSlj7mAr3JtPY"
# Global cap on stored photo bytes across all families (R2 free tier is 10 GB; default 9 GB when unset).
MAX_TOTAL_PHOTO_BYTES = "9000000000"
# Owner dashboard (/admin): Cloudflare Access application on app.ar.gxware.org. Not secrets.
ACCESS_TEAM_DOMAIN = "cerbero.cloudflareaccess.com"
ACCESS_AUD = "b24786f2ae9c9d173e497f74d19abc40edda78dd7abc25525a2798e9d46cf2af"
# Resource usage on the dashboard (Cloudflare GraphQL Analytics; the token is the CF_ANALYTICS_TOKEN secret).
CF_ACCOUNT_ID = "d332b3385566decf1a29b4b9177a730a"
D1_DATABASE_ID = "16d422ac-e415-4c87-98de-c815c439cbb6"
WORKER_NAME = "andata-ritorno-app"
R2_BUCKET_NAME = "andata-ritorno-photos"

[[d1_databases]]
binding = "DB"
database_name = "andata-ritorno"
# Placeholder: create the database (`wrangler d1 create andata-ritorno`) and paste its id here.
database_id = "16d422ac-e415-4c87-98de-c815c439cbb6"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "andata-ritorno-photos"

# Optional at runtime: the code skips limiting when these are not bound.
[[ratelimits]]
name = "RL_STRICT"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_API"
namespace_id = "1002"
# Per device on token routes (a first sync makes one call per photo), per IP elsewhere.
simple = { limit = 600, period = 60 }

# Secrets (wrangler secret put): STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET,
# EMAIL_HMAC_KEY, CODE_HMAC_KEY, RESEND_API_KEY.
# Optional: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID (owner notification on each purchase).

# Daily housekeeping: retry failed photo purges, drop stale budget and link rows (store.js sweep).
[triggers]
crons = ["17 3 * * *"]
