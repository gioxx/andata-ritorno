# Public app (static assets) plus the family sharing API under /api/*.
name = "andata-ritorno-app"
main = "src/index.js"
compatibility_date = "2026-10-01"
# One origin only: IndexedDB is per-origin, so a second hostname would show an empty app.
workers_dev = false
preview_urls = false
routes = [{ pattern = "app.ar.gioxx.org", custom_domain = true }]

[assets]
directory = "../app/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Only /api/* runs the Worker first; everything else is served straight from the assets.
run_worker_first = ["/api/*"]

[vars]
APP_ORIGIN = "https://app.ar.gioxx.org"
# The landing site, allowed to open Checkout (POST /api/checkout) and read the code it produced.
SITE_ORIGIN = "https://ar.gioxx.org"
# Stripe payment links behind GET /api/buy/family and /api/buy/slot (closed registrations stop family sales).
PAY_LINK_FAMILY = "https://buy.stripe.com/cNi8wOcBM4lV3Na6ts5EY00"
PAY_LINK_SLOT = "https://buy.stripe.com/6oUeVcdFQ3hRbfC4lk5EY01"
# Stripe price ids (not secret); set the real ones at deploy time.
PRICE_FAMILY = "price_1UX1rBCfwq1bSlj7kUtZDqVK"
PRICE_SLOT = "price_1UX1rBCfwq1bSlj7mAr3JtPY"
# Global cap on stored photo bytes across all families (R2 free tier is 10 GB; default 9 GB when unset).
MAX_TOTAL_PHOTO_BYTES = "9000000000"
# Owner dashboard (/admin): Cloudflare Access application on app.ar.gioxx.org. Not secrets.
ACCESS_TEAM_DOMAIN = "cerbero.cloudflareaccess.com"
ACCESS_AUD = "b24786f2ae9c9d173e497f74d19abc40edda78dd7abc25525a2798e9d46cf2af"

[[d1_databases]]
binding = "DB"
database_name = "andata-ritorno"
# Placeholder: create the database (`wrangler d1 create andata-ritorno`) and paste its id here.
database_id = "16d422ac-e415-4c87-98de-c815c439cbb6"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "andata-ritorno-photos"

# Optional at runtime: the code skips limiting when these are not bound.
[[ratelimits]]
name = "RL_STRICT"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_API"
namespace_id = "1002"
# Per device on token routes (a first sync makes one call per photo), per IP elsewhere.
simple = { limit = 600, period = 60 }

# Secrets (wrangler secret put): STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET,
# EMAIL_HMAC_KEY, CODE_HMAC_KEY, RESEND_API_KEY.

# Test copy on its own origin, database and bucket: `--env test` (`npm run deploy:test`), with
# Stripe in test mode.
# Bindings, vars and routes are not inherited by environments, so they are repeated.
[env.test]
routes = [{ pattern = "ar-test.gioxx.org", custom_domain = true }]

[env.test.vars]
APP_ORIGIN = "https://ar-test.gioxx.org"
# Stripe test-mode prices (sandbox): payments here never charge a real card.
PRICE_FAMILY = "price_1UX01dEFvDNKlb6tsEMmZ1ff"
PRICE_SLOT = "price_1UX01eEFvDNKlb6tcS4Lh2wV"
# Test-mode payment links behind /api/buy/* (the app links there, not to Stripe directly).
PAY_LINK_FAMILY = "https://buy.stripe.com/test_14AbJ1e9RbiV7si8P31oI00"
PAY_LINK_SLOT = "https://buy.stripe.com/test_fZu9ATe9RaeR6oe0ix1oI01"
MAX_TOTAL_PHOTO_BYTES = "500000000"
# Owner dashboard (/admin): Cloudflare Access application "A/R admin (test)". Not secrets.
ACCESS_TEAM_DOMAIN = "cerbero.cloudflareaccess.com"
ACCESS_AUD = "b24786f2ae9c9d173e497f74d19abc40edda78dd7abc25525a2798e9d46cf2af"

[[env.test.d1_databases]]
binding = "DB"
database_name = "andata-ritorno-test"
database_id = "63986218-f8b9-4ac4-86d2-4650fe8e7ebd"

[[env.test.r2_buckets]]
binding = "PHOTOS"
bucket_name = "andata-ritorno-test-photos"

[[env.test.ratelimits]]
name = "RL_STRICT"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

[[env.test.ratelimits]]
name = "RL_API"
namespace_id = "1004"
simple = { limit = 600, period = 60 }
