# v2 public app: static assets only, no API.
name = "andata-ritorno-app"
compatibility_date = "2026-10-01"
# One origin only: IndexedDB is per-origin, so a second hostname would show an empty app.
workers_dev = false
preview_urls = false
routes = [{ pattern = "ar.gioxx.org", custom_domain = true }]

[assets]
directory = "../app/dist"
not_found_handling = "single-page-application"
