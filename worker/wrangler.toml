name = "andata-ritorno"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Serve the PWA from /legacy as static assets
[assets]
directory = "../legacy"

[[d1_databases]]
binding = "DB"
database_name = "andata-ritorno"
database_id = "REPLACE_WITH_D1_ID"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "andata-ritorno-photos"
