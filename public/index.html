<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Andata e Ritorno</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#3b6ea5">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1d2330; --muted:#6b7280; --accent:#3b6ea5; --school:#e8f0fa; --home:#eaf6ec; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171c; --card:#1f242c; --fg:#e8eaee; --muted:#9aa3af; --school:#1d2a3a; --home:#1d3324; } }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--fg); padding-bottom:90px; }
  header { position:sticky; top:0; background:var(--accent); color:#fff; padding:12px 16px; z-index:2; }
  header h1 { margin:0 0 8px; font-size:18px; }
  .tabs { display:flex; gap:6px; }
  .tabs button { flex:1; padding:8px; border:0; border-radius:8px; background:rgba(255,255,255,.2); color:#fff; font-weight:600; }
  .tabs button.active { background:#fff; color:var(--accent); }
  section { margin:12px 16px; padding:12px; border-radius:12px; }
  section.school { background:var(--school); } section.home { background:var(--home); }
  section h2 { margin:0 0 10px; font-size:15px; display:flex; justify-content:space-between; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px; min-height:40px; }
  .item { position:relative; background:var(--card); border-radius:10px; overflow:hidden; aspect-ratio:1; border:3px solid transparent; }
  .item.selected { border-color:var(--accent); }
  .item img { width:100%; height:100%; object-fit:cover; display:block; }
  .item span { position:absolute; bottom:0; left:0; right:0; font-size:11px; padding:2px 4px; background:rgba(0,0,0,.55); color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .empty { color:var(--muted); font-size:13px; }
  .bar { position:fixed; bottom:0; left:0; right:0; display:flex; gap:8px; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); background:var(--card); box-shadow:0 -2px 8px rgba(0,0,0,.1); }
  .bar button { flex:1; padding:12px; border:0; border-radius:10px; font-weight:600; font-size:15px; background:var(--accent); color:#fff; }
  .bar button.secondary { background:var(--bg); color:var(--fg); }
  .bar button:disabled { opacity:.4; }
  footer { margin:20px 16px; padding:12px; border-radius:12px; background:var(--card); font-size:13px; color:var(--muted); }
  footer .row { display:flex; gap:8px; margin-top:8px; }
  footer button { flex:1; padding:10px; border:1px solid var(--accent); border-radius:8px; background:transparent; color:var(--accent); font-weight:600; }
</style>
</head>
<body>
<header>
  <h1>A/R · Andata e Ritorno</h1>
  <div class="tabs" id="tabs"></div>
</header>
<main id="main"></main>
<footer>
  <div><strong>Backup</strong> · <span id="backupInfo"></span></div>
  <div id="persistInfo"></div>
  <div class="row">
    <button id="export">⬇ Esporta</button>
    <button id="import">⬆ Importa</button>
  </div>
</footer>
<div class="bar" id="bar"></div>
<input type="file" id="camera" accept="image/*" multiple hidden>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
// Mockup only: data lives in localStorage. The real app will call the Worker API (see /worker).
const CHILDREN = [{ id: 'nido', label: 'Nido' }, { id: 'materna', label: 'Materna' }];
const KEY = 'ar-mockup-v1';
const BACKUP_KEY = 'ar-mockup-last-backup';

let state = load();
let currentChild = 'nido';
let selected = new Set();
let clipboardHasImage = null; // null = unknown (no permission yet): show Incolla anyway

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || { items: [] }; } catch { return { items: [] }; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { alert('Storage full: ' + e.message); }
}

// Resize and compress a photo client-side to keep storage small.
function compress(file, max = 600, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = img.width * scale; c.height = img.height * scale;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      // Safari can't encode WebP and silently returns PNG (huge): fall back to JPEG.
      let url = c.toDataURL('image/webp', quality);
      if (!url.startsWith('data:image/webp')) url = c.toDataURL('image/jpeg', quality);
      resolve(url);
      URL.revokeObjectURL(img.src);
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

function render() {
  document.getElementById('tabs').innerHTML = CHILDREN.map(c =>
    `<button class="${c.id === currentChild ? 'active' : ''}" data-child="${c.id}">${c.label}</button>`).join('');

  const items = state.items.filter(i => i.child === currentChild);
  const section = (loc, title, cls) => {
    const list = items.filter(i => i.location === loc);
    return `<section class="${cls}"><h2>${title}<small>${list.length}</small></h2><div class="grid">${
      list.length ? list.map(i => `<div class="item ${selected.has(i.id) ? 'selected' : ''}" data-id="${i.id}">
        <img src="${i.photo}" alt=""><span>${esc(i.label || '')}</span></div>`).join('')
      : '<div class="empty">Nessun capo</div>'}</div></section>`;
  };
  document.getElementById('main').innerHTML =
    section('school', '🏫 A scuola', 'school') + section('home', '🏠 A casa', 'home');

  const sel = [...selected].map(id => state.items.find(i => i.id === id)).filter(Boolean);
  const bar = document.getElementById('bar');
  if (!sel.length) {
    const showPaste = navigator.clipboard?.read && clipboardHasImage !== false;
    bar.innerHTML = `<button id="add">📷 Aggiungi capi</button>${showPaste ? '<button id="paste">📋 Incolla</button>' : ''}`;
  } else {
    const allSchool = sel.every(i => i.location === 'school');
    const allHome = sel.every(i => i.location === 'home');
    bar.innerHTML = `
      <button class="secondary" id="clear">Annulla (${sel.length})</button>
      ${allSchool ? '' : '<button id="toSchool">→ Scuola</button>'}
      ${allHome ? '' : '<button id="toHome">→ Casa</button>'}
      <button class="secondary" id="del">🗑</button>`;
  }
  renderBackupInfo();
}

function renderBackupInfo() {
  let last = null;
  try { last = localStorage.getItem(BACKUP_KEY); } catch {}
  document.getElementById('backupInfo').textContent =
    `${state.items.length} capi · ultimo backup: ${last ? new Date(last).toLocaleString('it-IT') : 'mai'}`;
}

// Export everything (photos included) as a JSON file: share sheet on Android (e.g. Drive), download otherwise.
async function exportBackup() {
  const now = new Date();
  const data = JSON.stringify({ app: 'andata-ritorno', version: 1, exportedAt: now.toISOString(), items: state.items });
  const name = `andata-ritorno-${now.toISOString().slice(0, 10)}.json`;
  const file = new File([data], name, { type: 'application/json' });
  try {
    if (navigator.canShare?.({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Backup Andata e Ritorno' });
    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(file); a.download = name; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    }
  } catch (e) {
    if (e.name === 'AbortError') return; // user closed the share sheet
    return alert('Esportazione non riuscita: ' + e.message);
  }
  try { localStorage.setItem(BACKUP_KEY, now.toISOString()); } catch {}
  renderBackupInfo();
}

// Merge a backup into current data: new items are added, existing ones keep the most recent move.
async function importBackup(file) {
  let items;
  try {
    const data = JSON.parse(await file.text());
    items = (data.items || []).filter(i => i && i.id && i.photo && ['school', 'home'].includes(i.location) && CHILDREN.some(c => c.id === i.child));
  } catch { return alert('File non valido'); }
  if (!items.length) return alert('Nessun capo trovato nel file');
  let added = 0, updated = 0;
  for (const i of items) {
    const existing = state.items.find(x => x.id === i.id);
    if (!existing) { state.items.push(i); added++; }
    else if ((i.movedAt || '') > (existing.movedAt || '')) { Object.assign(existing, i); updated++; }
  }
  save(); render();
  alert(`Importati ${added} capi nuovi, ${updated} aggiornati`);
}

// Ask Chrome not to evict our storage under disk pressure.
async function requestPersistence() {
  const el = document.getElementById('persistInfo');
  if (!navigator.storage?.persist) return;
  const ok = await navigator.storage.persisted() || await navigator.storage.persist();
  el.textContent = ok ? 'Memoria protetta ✓' : 'Memoria non protetta: fai backup spesso';
}

function move(location) {
  const now = new Date().toISOString();
  state.items.forEach(i => { if (selected.has(i.id)) { i.location = location; i.movedAt = now; } });
  selected.clear(); save(); render();
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-child],[data-id],button');
  if (!t) return;
  if (t.dataset.child) { currentChild = t.dataset.child; selected.clear(); }
  else if (t.dataset.id) { selected.has(t.dataset.id) ? selected.delete(t.dataset.id) : selected.add(t.dataset.id); }
  else if (t.id === 'add') return document.getElementById('camera').click();
  else if (t.id === 'paste') return pasteFromClipboard();
  else if (t.id === 'export') return exportBackup();
  else if (t.id === 'import') return document.getElementById('importFile').click();
  else if (t.id === 'clear') selected.clear();
  else if (t.id === 'toSchool') return move('school');
  else if (t.id === 'toHome') return move('home');
  else if (t.id === 'del' && confirm('Eliminare i capi selezionati?')) {
    state.items = state.items.filter(i => !selected.has(i.id)); selected.clear(); save();
  }
  render();
});

// Add image files/blobs as new items (at home) for the current child.
async function addFiles(files) {
  files = files.filter(f => f.type.startsWith('image/'));
  if (!files.length) return false;
  // Single photo: ask for a description. Several photos: skip the prompt to keep bulk import quick.
  const label = files.length === 1 ? (prompt('Descrizione (opzionale)', '') || '') : '';
  for (const file of files) {
    const photo = await compress(file);
    state.items.push({ id: crypto.randomUUID(), child: currentChild, location: 'home', label, photo, movedAt: new Date().toISOString() });
  }
  save(); render();
  return true;
}

// Paste an image copied elsewhere (e.g. Google Keep: long-press photo, Copy).
async function pasteFromClipboard() {
  if (!navigator.clipboard?.read) return alert('Incolla non supportato da questo browser');
  try {
    const files = [];
    for (const item of await navigator.clipboard.read()) {
      const type = item.types.find(t => t.startsWith('image/'));
      if (type) files.push(new File([await item.getType(type)], 'incollata', { type }));
    }
    if (!await addFiles(files)) { alert("Negli appunti non c'è un'immagine. Copia prima la foto (es. da Keep), poi tocca Incolla."); checkClipboard(); }
  } catch (e) {
    alert(e.name === 'NotAllowedError'
      ? 'Accesso agli appunti negato: consentilo quando Chrome lo chiede (o dalle impostazioni del sito).'
      : 'Incolla non riuscito: ' + e.message);
  }
}

// Once clipboard access is granted, peek at the clipboard when the app comes to the foreground
// and show Incolla only if it holds an image. Before the first grant the state is unknown, so the button stays.
async function checkClipboard() {
  if (!navigator.clipboard?.read || !navigator.permissions) return;
  const before = clipboardHasImage;
  try {
    const { state } = await navigator.permissions.query({ name: 'clipboard-read' });
    if (state === 'denied') clipboardHasImage = false;
    else if (state === 'granted') clipboardHasImage = (await navigator.clipboard.read()).some(i => i.types.some(t => t.startsWith('image/')));
    else clipboardHasImage = null;
  } catch { clipboardHasImage = null; } // e.g. document not focused, or permission name unsupported
  if (clipboardHasImage !== before) render();
}
window.addEventListener('focus', checkClipboard);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkClipboard(); });

document.getElementById('camera').addEventListener('change', e => {
  const files = [...e.target.files]; e.target.value = '';
  addFiles(files);
});

// Keyboard / context-menu paste (desktop, or Android when a paste event fires).
document.addEventListener('paste', e => {
  const files = [...(e.clipboardData?.files || [])];
  if (files.length) { e.preventDefault(); addFiles(files); }
});

document.getElementById('importFile').addEventListener('change', e => {
  const file = e.target.files[0]; e.target.value = '';
  if (file) importBackup(file);
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
render();
requestPersistence().catch(() => {});
checkClipboard();
</script>
</body>
</html>
