<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Andata e Ritorno</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#3b6ea5">
<script>
  // Apply the saved theme before first paint to avoid a flash. 'auto' (no attribute) follows the system.
  try { const t = localStorage.getItem('ar-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
</script>
<style>
  :root { color-scheme:light; --bg:#f6f7f9; --card:#fff; --fg:#1d2330; --muted:#6b7280; --accent:#3b6ea5; --school:#e8f0fa; --home:#eaf6ec; --warn-bg:#fff4d6; --warn-fg:#7a5200; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme:dark; --bg:#14171c; --card:#1f242c; --fg:#e8eaee; --muted:#9aa3af; --school:#1d2a3a; --home:#1d3324; --warn-bg:#3a2f12; --warn-fg:#f2d48a; }
  }
  :root[data-theme="dark"] { color-scheme:dark; --bg:#14171c; --card:#1f242c; --fg:#e8eaee; --muted:#9aa3af; --school:#1d2a3a; --home:#1d3324; --warn-bg:#3a2f12; --warn-fg:#f2d48a; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--fg); padding-bottom:90px; }
  header { position:sticky; top:0; background:var(--accent); color:#fff; padding:12px 16px; z-index:2; }
  header .top { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  header h1 { margin:0; font-size:18px; }
  #menuBtn { border:0; background:none; color:#fff; font-size:22px; line-height:1; padding:4px 8px; margin-right:-8px; }
  .tabs { display:flex; gap:6px; }
  .tabs button { flex:1; padding:8px; border:0; border-radius:8px; background:rgba(255,255,255,.2); color:#fff; font-weight:600; }
  .tabs button.active { background:#fff; color:var(--accent); }
  section { margin:12px 16px; padding:12px; border-radius:12px; }
  section.school { background:var(--school); } section.home { background:var(--home); }
  section h2 { margin:0 0 10px; font-size:15px; display:flex; justify-content:space-between; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px; min-height:40px; }
  .item { position:relative; background:var(--card); border-radius:10px; overflow:hidden; aspect-ratio:1; border:3px solid transparent; }
  .item.selected { border-color:var(--accent); }
  .item img { width:100%; height:100%; object-fit:cover; display:block; }
  .item span { position:absolute; bottom:0; left:0; right:0; font-size:11px; padding:2px 4px; background:rgba(0,0,0,.55); color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .empty { color:var(--muted); font-size:13px; }
  .unsaved { display:flex; align-items:center; gap:8px; margin:12px 16px 0; padding:10px 12px; border-radius:12px; background:var(--warn-bg); color:var(--warn-fg); font-size:14px; }
  .unsaved span { flex:1; }
  .unsaved button { padding:8px 12px; border:0; border-radius:8px; background:#b07800; color:#fff; font-weight:600; }
  .bar { position:fixed; bottom:0; left:0; right:0; display:flex; gap:8px; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); background:var(--card); box-shadow:0 -2px 8px rgba(0,0,0,.1); }
  .bar button { flex:1; padding:12px; border:0; border-radius:10px; font-weight:600; font-size:15px; background:var(--accent); color:#fff; }
  .bar button.secondary { background:var(--bg); color:var(--fg); }
  .bar button:disabled { opacity:.4; }
  dialog { border:0; border-radius:14px; padding:16px; width:min(92vw,360px); background:var(--card); color:var(--fg); }
  dialog::backdrop { background:rgba(0,0,0,.5); }
  dialog h3 { margin:0 0 10px; font-size:16px; }
  dialog .preview { display:flex; gap:6px; overflow-x:auto; margin-bottom:10px; }
  dialog .preview img { width:72px; height:72px; object-fit:cover; border-radius:8px; flex:none; }
  dialog input { width:100%; padding:10px; border:1px solid var(--muted); border-radius:8px; font-size:15px; background:var(--bg); color:var(--fg); margin-bottom:12px; }
  dialog .row { display:flex; gap:8px; }
  dialog .row button { flex:1; padding:12px; border:0; border-radius:10px; font-weight:600; font-size:15px; background:var(--bg); color:var(--fg); }
  dialog .row button.primary { background:var(--accent); color:#fff; }
  dialog .cancel { display:block; width:100%; margin-top:8px; padding:8px; border:0; background:none; color:var(--muted); font-size:14px; }
  /* Side drawer sliding in from the right */
  #menu { margin:0; inset:0 0 0 auto; width:min(82vw,320px); height:100dvh; max-height:100dvh; max-width:none;
    border-radius:16px 0 0 16px; padding:calc(16px + env(safe-area-inset-top)) 16px 16px;
    transform:translateX(100%); transition:transform .25s ease, display .25s allow-discrete, overlay .25s allow-discrete; }
  #menu[open] { transform:none; }
  @starting-style { #menu[open] { transform:translateX(100%); } }
  #menu::backdrop { background:rgba(0,0,0,0); transition:background .25s, display .25s allow-discrete, overlay .25s allow-discrete; }
  #menu[open]::backdrop { background:rgba(0,0,0,.5); }
  @starting-style { #menu[open]::backdrop { background:rgba(0,0,0,0); } }
  #menu h3 { display:flex; justify-content:space-between; align-items:center; }
  #menu .close { border:0; background:none; color:var(--muted); font-size:20px; padding:0 4px; }
  #menu .info { font-size:13px; color:var(--muted); margin-bottom:12px; line-height:1.5; }
  #menu h4 { margin:14px 0 8px; font-size:14px; }
  #menu h3 + h4 { margin-top:4px; }
  .seg { display:flex; gap:4px; padding:4px; border-radius:10px; background:var(--bg); }
  .seg button { flex:1; padding:8px 4px; border:0; border-radius:7px; background:none; color:var(--fg); font-size:14px; font-weight:600; }
  .seg button.active { background:var(--accent); color:#fff; }
  #menu .menuItem { display:block; width:100%; text-align:left; padding:12px; margin-bottom:6px; border:0; border-radius:10px; background:var(--bg); color:var(--fg); font-size:15px; font-weight:600; }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>A/R · Andata e Ritorno</h1>
    <button id="menuBtn" aria-label="Menu">☰</button>
  </div>
  <div class="tabs" id="tabs"></div>
</header>
<main id="main"></main>
<dialog id="menu">
  <h3>Menu <button class="close" id="menuClose" aria-label="Chiudi">✕</button></h3>
  <h4>Backup</h4>
  <div class="info"><span id="backupInfo"></span><br><span id="persistInfo"></span></div>
  <button class="menuItem" id="export">⬇ Esporta backup</button>
  <button class="menuItem" id="import">⬆ Importa backup</button>
  <h4>Tema</h4>
  <div class="seg" id="themeSeg">
    <button data-theme-choice="auto">Auto</button>
    <button data-theme-choice="light">☀ Chiaro</button>
    <button data-theme-choice="dark">☾ Scuro</button>
  </div>
</dialog>
<div class="bar" id="bar"></div>
<dialog id="newItem">
  <form method="dialog">
    <h3 id="newTitle"></h3>
    <div class="preview" id="newPreview"></div>
    <input id="newLabel" placeholder="Descrizione (opzionale)" autocomplete="off">
    <div class="row">
      <button value="school" class="primary">🏫 A scuola</button>
      <button value="home">🏠 A casa</button>
    </div>
    <button value="" class="cancel">Annulla</button>
  </form>
</dialog>
<dialog id="source">
  <form method="dialog">
    <h3>Aggiungi capi</h3>
    <div class="row">
      <button type="button" data-source="camera" class="primary">📷 Scatta</button>
      <button type="button" data-source="gallery">🖼️ Galleria</button>
    </div>
    <button value="" class="cancel">Annulla</button>
  </form>
</dialog>
<input type="file" id="camera" accept="image/*" capture="environment" hidden>
<input type="file" id="gallery" accept="image/*" multiple hidden>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
// Mockup only: data lives in localStorage. The real app will call the Worker API (see /worker).
const CHILDREN = [{ id: 'nido', label: 'Nido' }, { id: 'materna', label: 'Materna' }];
const KEY = 'ar-mockup-v1';
const BACKUP_KEY = 'ar-mockup-last-backup';
const UNSAVED_KEY = 'ar-mockup-unsaved'; // changes made since the last export

let state = load();
let currentChild = 'nido';
let selected = new Set();
let clipboardHasImage = null; // null = unknown (no permission yet): show Incolla anyway

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || { items: [] }; } catch { return { items: [] }; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { alert('Storage full: ' + e.message); }
}

// Resize and compress a photo client-side to keep storage small.
function compress(file, max = 600, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = img.width * scale; c.height = img.height * scale;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      // Safari can't encode WebP and silently returns PNG (huge): fall back to JPEG.
      let url = c.toDataURL('image/webp', quality);
      if (!url.startsWith('data:image/webp')) url = c.toDataURL('image/jpeg', quality);
      resolve(url);
      URL.revokeObjectURL(img.src);
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

function render() {
  document.getElementById('tabs').innerHTML = CHILDREN.map(c =>
    `<button class="${c.id === currentChild ? 'active' : ''}" data-child="${c.id}">${c.label}</button>`).join('');

  const items = state.items.filter(i => i.child === currentChild);
  const section = (loc, title, cls) => {
    const list = items.filter(i => i.location === loc);
    return `<section class="${cls}"><h2>${title}<small>${list.length}</small></h2><div class="grid">${
      list.length ? list.map(i => `<div class="item ${selected.has(i.id) ? 'selected' : ''}" data-id="${i.id}">
        <img src="${i.photo}" alt=""><span>${esc(i.label || '')}</span></div>`).join('')
      : '<div class="empty">Nessun capo</div>'}</div></section>`;
  };
  const n = unsavedCount();
  const banner = n ? `<div class="unsaved"><span>⚠ ${n === 1 ? '1 modifica non salvata' : `${n} modifiche non salvate`}</span><button id="exportNow">Esporta</button></div>` : '';
  document.getElementById('main').innerHTML = banner +
    section('school', '🏫 A scuola', 'school') + section('home', '🏠 A casa', 'home');

  const sel = [...selected].map(id => state.items.find(i => i.id === id)).filter(Boolean);
  const bar = document.getElementById('bar');
  if (!sel.length) {
    const showPaste = navigator.clipboard?.read && clipboardHasImage !== false;
    bar.innerHTML = `<button id="add">📷 Aggiungi capi</button>${showPaste ? '<button id="paste">📋 Incolla</button>' : ''}`;
  } else {
    const allSchool = sel.every(i => i.location === 'school');
    const allHome = sel.every(i => i.location === 'home');
    bar.innerHTML = `
      <button class="secondary" id="clear">Annulla (${sel.length})</button>
      ${allSchool ? '' : '<button id="toSchool">→ Scuola</button>'}
      ${allHome ? '' : '<button id="toHome">→ Casa</button>'}
      <button class="secondary" id="del">🗑</button>`;
  }
  renderBackupInfo();
}

// Swipe right on the drawer to close it.
(() => {
  const menu = document.getElementById('menu');
  let x0 = null;
  menu.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  menu.addEventListener('touchend', e => {
    if (x0 !== null && e.changedTouches[0].clientX - x0 > 60) menu.close();
    x0 = null;
  });
})();

function setTheme(choice) {
  if (choice === 'auto') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = choice;
  try { localStorage.setItem('ar-theme', choice); } catch {}
  renderThemeSeg();
}
function renderThemeSeg() {
  const current = document.documentElement.dataset.theme || 'auto';
  document.querySelectorAll('[data-theme-choice]').forEach(b => b.classList.toggle('active', b.dataset.themeChoice === current));
}

function unsavedCount() {
  try { return Number(localStorage.getItem(UNSAVED_KEY)) || 0; } catch { return 0; }
}
function markChanged(n = 1) {
  try { localStorage.setItem(UNSAVED_KEY, unsavedCount() + n); } catch {}
}

function renderBackupInfo() {
  let last = null;
  try { last = localStorage.getItem(BACKUP_KEY); } catch {}
  document.getElementById('backupInfo').textContent =
    `${state.items.length === 1 ? '1 capo' : `${state.items.length} capi`} · ultimo backup: ${last ? new Date(last).toLocaleString('it-IT') : 'mai'}`;
}

// Export everything (photos included) as a JSON file: share sheet on Android (e.g. Drive), download otherwise.
async function exportBackup() {
  const now = new Date();
  const data = JSON.stringify({ app: 'andata-ritorno', version: 1, exportedAt: now.toISOString(), items: state.items });
  const name = `andata-ritorno-${now.toISOString().slice(0, 10)}.json`;
  const file = new File([data], name, { type: 'application/json' });
  const download = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  };
  try {
    if (navigator.canShare?.({ files: [file] })) await navigator.share({ files: [file], title: 'Backup Andata e Ritorno' });
    else download();
  } catch (e) {
    if (e.name === 'AbortError') return; // user closed the share sheet
    // Android Chrome refuses to share some file types (NotAllowedError): save to Downloads instead.
    try { download(); } catch (e2) { return alert('Esportazione non riuscita: ' + e2.message); }
    alert('File salvato in Download: ' + name);
  }
  try { localStorage.setItem(BACKUP_KEY, now.toISOString()); localStorage.removeItem(UNSAVED_KEY); } catch {}
  render();
}

// Merge a backup into current data: new items are added, existing ones keep the most recent move.
async function importBackup(file) {
  let items;
  try {
    const data = JSON.parse(await file.text());
    items = (data.items || []).filter(i => i && i.id && i.photo && ['school', 'home'].includes(i.location) && CHILDREN.some(c => c.id === i.child));
  } catch { return alert('File non valido'); }
  if (!items.length) return alert('Nessun capo trovato nel file');
  let added = 0, updated = 0;
  for (const i of items) {
    const existing = state.items.find(x => x.id === i.id);
    if (!existing) { state.items.push(i); added++; }
    else if ((i.movedAt || '') > (existing.movedAt || '')) { Object.assign(existing, i); updated++; }
  }
  markChanged(added + updated);
  save(); render();
  alert(`Importati ${added} capi nuovi, ${updated} aggiornati`);
}

// Ask Chrome not to evict our storage under disk pressure.
async function requestPersistence() {
  const el = document.getElementById('persistInfo');
  if (!navigator.storage?.persist) return;
  const ok = await navigator.storage.persisted() || await navigator.storage.persist();
  el.textContent = ok ? 'Memoria protetta ✓' : 'Memoria non protetta: fai backup spesso';
}

function move(location) {
  const now = new Date().toISOString();
  state.items.forEach(i => { if (selected.has(i.id)) { i.location = location; i.movedAt = now; } });
  markChanged(selected.size);
  selected.clear(); save(); render();
}

document.addEventListener('click', e => {
  if (e.target.closest('#newItem')) return; // the new-item dialog handles its own buttons
  const sourceBtn = e.target.closest('[data-source]');
  if (sourceBtn) { // click the input inside the same tap, so the browser lets the picker open
    document.getElementById('source').close();
    return document.getElementById(sourceBtn.dataset.source).click();
  }
  if (e.target.closest('#source')) return;
  const menu = document.getElementById('menu');
  if (e.target.id === 'menuClose') return menu.close();
  if (e.target === menu) { // the dialog itself is the target for both its padding and the backdrop
    const r = menu.getBoundingClientRect();
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) menu.close();
    return;
  }
  if (e.target.id === 'menuBtn') return menu.showModal();
  const themeBtn = e.target.closest('[data-theme-choice]');
  if (themeBtn) return setTheme(themeBtn.dataset.themeChoice); // keep the menu open to see the result
  if (menu.open && e.target.closest('#menu .menuItem')) menu.close();
  const t = e.target.closest('[data-child],[data-id],button');
  if (!t) return;
  if (t.dataset.child) { currentChild = t.dataset.child; selected.clear(); }
  else if (t.dataset.id) { selected.has(t.dataset.id) ? selected.delete(t.dataset.id) : selected.add(t.dataset.id); }
  else if (t.id === 'add') return document.getElementById('source').showModal();
  else if (t.id === 'paste') return pasteFromClipboard();
  else if (t.id === 'export' || t.id === 'exportNow') return exportBackup();
  else if (t.id === 'import') return document.getElementById('importFile').click();
  else if (t.id === 'clear') selected.clear();
  else if (t.id === 'toSchool') return move('school');
  else if (t.id === 'toHome') return move('home');
  else if (t.id === 'del' && confirm('Eliminare i capi selezionati?')) {
    state.items = state.items.filter(i => !selected.has(i.id)); markChanged(selected.size); selected.clear(); save();
  }
  render();
});

// Ask where new photos go (school by default) and an optional description. Resolves to
// { location, label }, or null if cancelled.
function askNewItem(photos) {
  const dlg = document.getElementById('newItem');
  const child = CHILDREN.find(c => c.id === currentChild).label;
  document.getElementById('newTitle').textContent =
    photos.length === 1 ? `Nuovo capo · ${child}` : `${photos.length} nuovi capi · ${child}`;
  document.getElementById('newPreview').innerHTML = photos.map(src => `<img src="${src}" alt="">`).join('');
  const input = document.getElementById('newLabel');
  input.value = '';
  // Several photos: one description would be wrong for all of them, so skip it.
  input.hidden = photos.length > 1;
  dlg.returnValue = '';
  dlg.showModal();
  return new Promise(resolve => dlg.addEventListener('close', () =>
    resolve(dlg.returnValue ? { location: dlg.returnValue, label: input.hidden ? '' : input.value.trim() } : null), { once: true }));
}

// Add image files/blobs as new items for the current child.
async function addFiles(files) {
  files = files.filter(f => f.type.startsWith('image/'));
  if (!files.length) return false;
  const photos = await Promise.all(files.map(f => compress(f)));
  const choice = await askNewItem(photos);
  if (!choice) return true;
  const now = new Date().toISOString();
  for (const photo of photos) {
    state.items.push({ id: crypto.randomUUID(), child: currentChild, location: choice.location, label: choice.label, photo, movedAt: now });
  }
  markChanged(photos.length);
  save(); render();
  return true;
}

// Paste an image copied elsewhere (e.g. Google Keep: long-press photo, Copy).
async function pasteFromClipboard() {
  if (!navigator.clipboard?.read) return alert('Incolla non supportato da questo browser');
  try {
    const files = [];
    for (const item of await navigator.clipboard.read()) {
      const type = item.types.find(t => t.startsWith('image/'));
      if (type) files.push(new File([await item.getType(type)], 'incollata', { type }));
    }
    if (!await addFiles(files)) { alert("Negli appunti non c'è un'immagine. Copia prima la foto (es. da Keep), poi tocca Incolla."); checkClipboard(); }
  } catch (e) {
    alert(e.name === 'NotAllowedError'
      ? 'Accesso agli appunti negato: consentilo quando Chrome lo chiede (o dalle impostazioni del sito).'
      : 'Incolla non riuscito: ' + e.message);
  }
}

// Once clipboard access is granted, peek at the clipboard when the app comes to the foreground
// and show Incolla only if it holds an image. Before the first grant the state is unknown, so the button stays.
async function checkClipboard() {
  if (!navigator.clipboard?.read || !navigator.permissions) return;
  const before = clipboardHasImage;
  try {
    const { state } = await navigator.permissions.query({ name: 'clipboard-read' });
    if (state === 'denied') clipboardHasImage = false;
    else if (state === 'granted') clipboardHasImage = (await navigator.clipboard.read()).some(i => i.types.some(t => t.startsWith('image/')));
    else clipboardHasImage = null;
  } catch { clipboardHasImage = null; } // e.g. document not focused, or permission name unsupported
  if (clipboardHasImage !== before) render();
}
window.addEventListener('focus', checkClipboard);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkClipboard(); });

// Camera (capture opens the rear camera directly) and gallery (multi-select) share one handler.
for (const id of ['camera', 'gallery']) document.getElementById(id).addEventListener('change', e => {
  const files = [...e.target.files]; e.target.value = '';
  addFiles(files);
});

// Keyboard / context-menu paste (desktop, or Android when a paste event fires).
document.addEventListener('paste', e => {
  const files = [...(e.clipboardData?.files || [])];
  if (files.length) { e.preventDefault(); addFiles(files); }
});

document.getElementById('importFile').addEventListener('change', e => {
  const file = e.target.files[0]; e.target.value = '';
  if (file) importBackup(file);
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
render();
renderThemeSeg();
requestPersistence().catch(() => {});
checkClipboard();
</script>
</body>
</html>
