<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Andata e Ritorno</title>
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbf7f1">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0f15">
<script>
  // Apply the saved theme before first paint to avoid a flash. 'auto' (no attribute) follows the system.
  try { const t = localStorage.getItem('ar-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
</script>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
