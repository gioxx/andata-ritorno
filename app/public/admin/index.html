<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Dashboard · A/R</title>
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<header class="top">
  <div class="brand"><img src="/icons/icon.svg" alt="" width="32" height="32"><span>A/R<small>Dashboard</small></span></div>
  <p class="meta" id="at" role="status">Caricamento…</p>
  <button type="button" class="ghost" id="reload">Aggiorna</button>
</header>

<main>
  <section class="resources" aria-labelledby="res-h">
    <h2 id="res-h" class="section-h">Risorse consumate <span class="sub">rispetto ai limiti dei piani gratuiti</span></h2>
    <div id="res"></div>
  </section>

  <h2 class="section-h">Utilizzo di A/R</h2>
  <div class="filters" role="group" aria-label="Filtri">
    <div class="seg" id="range" role="radiogroup" aria-label="Periodo">
      <button type="button" role="radio" data-days="7" aria-checked="false">7 giorni</button>
      <button type="button" role="radio" data-days="30" aria-checked="true">30 giorni</button>
      <button type="button" role="radio" data-days="90" aria-checked="false">90 giorni</button>
      <button type="button" role="radio" data-days="365" aria-checked="false">12 mesi</button>
    </div>
    <label class="select">Codici
      <select id="kind">
        <option value="all">Tutti</option>
        <option value="family">Famiglia</option>
        <option value="slot">Posto in più</option>
      </select>
    </label>
    <label class="check"><input type="checkbox" id="tables"> Mostra tabelle</label>
  </div>

  <div id="out" aria-live="polite"></div>
</main>

<div class="tip" id="tip" role="tooltip" hidden></div>
<script type="module" src="/admin/admin.js"></script>
</body>
</html>
